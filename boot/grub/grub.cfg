set default="0"
set timeout=5

insmod efi_gop
insmod efi_uga
insmod font
insmod gfxterm

set menu_color_normal=cyan/black
set menu_color_highlight=white/blue

menuentry "MitraOS V.1 (Apollo) - Desktop Workstation (Desktop & Installer)" --class debian --class gnu-linux --class os {
    set gfxpayload=keep
    linux /boot/vmlinuz boot=live quiet splash gui=1 mitra_desktop=1 apollo_desktop=1 mitra_live=1 apollo_live=1 ---
    initrd /boot/initrd.img
}

menuentry "MitraOS V.1 (Apollo) - Console Workstation (CLI & Installer)" --class debian --class gnu-linux --class os {
    set gfxpayload=keep
    linux /boot/vmlinuz boot=live quiet splash mitra_cli=1 mitra_live=1 apollo_live=1 ---
    initrd /boot/initrd.img
}

menuentry "MitraOS Direct Installer (HDD / SSD / NVMe / MicroSD)" --class debian --class gnu-linux --class os {
    set gfxpayload=keep
    linux /boot/vmlinuz boot=live mitra_install=1 apollo_install=1 ---
    initrd /boot/initrd.img
}

menuentry "MitraOS Safe Graphics / Ultra-low RAM (Pentium 4 Mode)" --class debian --class gnu-linux --class os {
    set gfxpayload=text
    linux /boot/vmlinuz boot=live nomodeset vga=normal mitra_lowram=1 apollo_lowram=1 ---
    initrd /boot/initrd.img
}

menuentry "Reboot System" {
    reboot
}

menuentry "Power Off" {
    halt
}
